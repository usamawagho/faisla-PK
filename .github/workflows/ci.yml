name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: faisla
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: faisla_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faisla -d faisla_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg2://faisla:ci-only-password@localhost:5432/faisla_ci
      SECRET_KEY: ci-only-secret-key-not-for-deployment-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q app tests alembic
      - name: Apply migrations to temporary PostgreSQL
        run: alembic upgrade head
      - name: Verify migration rollback and re-application on temporary PostgreSQL
        run: |
          alembic current
          alembic history
          alembic downgrade base
          alembic upgrade head
          alembic current
      - name: Run backend tests
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
